name: Build Auronn Play Saw Trap

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Descargar AIR SDK Manager
        run: |
          git clone --depth 1 \
            https://github.com/airsdk/airsdkmanager.git \
            airsdkmanager

          echo "=== AIR SDK Manager ==="
          ls -la airsdkmanager

      - name: Instalar AIR SDK
        run: |
          echo "Instalando AIR SDK..."

          mkdir -p "$HOME/.airsdk"

          cd airsdkmanager

          chmod +x gradlew

          ./gradlew build

          echo "=== AIR SDK Manager compilado ==="
          find . -maxdepth 4 -type f | head -50

      - name: Buscar AIR SDK
        run: |
          echo "Buscando ADT..."

          find "$HOME" -type f -name adt 2>/dev/null | head -20 || true

          find "$GITHUB_WORKSPACE" -type f -name adt 2>/dev/null | head -20 || true

      - name: Descargar SWF del juego
        run: |
          curl -L \
            "https://github.com/danaeeper/flash/releases/download/game-assets/auron_play_jig_trap.swf" \
            -o auron_play_jig_trap.swf

          echo "=== SWF descargado ==="
          ls -lh auron_play_jig_trap.swf

      - name: Crear application.xml
        run: |
          cat > application.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <application xmlns="http://ns.adobe.com/air/application/51.0">

              <id>com.catita.auronnplayjigtrap</id>

              <versionNumber>1.0.0</versionNumber>

              <filename>Auronn Play Saw Trap</filename>

              <name>Auronn Play Saw Trap</name>

              <description>Auronn Play Saw Trap</description>

              <initialWindow>

                  <content>auron_play_jig_trap.swf</content>

                  <visible>true</visible>

                  <fullScreen>true</fullScreen>

                  <aspectRatio>landscape</aspectRatio>

                  <autoOrients>false</autoOrients>

                  <renderMode>direct</renderMode>

              </initialWindow>

              <supportedProfiles>
                  <profile>mobileDevice</profile>
              </supportedProfiles>

              <iPhone>

                  <InfoAdditions><![CDATA[
                      <key>UIRequiresFullScreen</key>
                      <true/>

                      <key>UISupportedInterfaceOrientations</key>
                      <array>
                          <string>UIInterfaceOrientationLandscapeLeft</string>
                          <string>UIInterfaceOrientationLandscapeRight</string>
                      </array>
                  ]]></InfoAdditions>

              </iPhone>

          </application>
          EOF

          echo "=== application.xml ==="
          cat application.xml

      - name: Verificar archivos
        run: |
          echo "=============================="
          echo "ARCHIVOS DEL PROYECTO"
          echo "=============================="

          ls -lh

          echo ""
          echo "=============================="
          echo "SWF"
          echo "=============================="

          file auron_play_jig_trap.swf

          echo ""
          echo "=============================="
          echo "APPLICATION XML"
          echo "=============================="

          xmllint --noout application.xml

      - name: Buscar ADT
        id: find_adt
        run: |
          echo "Buscando herramienta ADT..."

          ADT=$(find "$HOME" "$GITHUB_WORKSPACE" \
            -type f \
            -name adt \
            -print \
            2>/dev/null | head -1)

          if [ -z "$ADT" ]; then
            echo "ERROR: No se encontró ADT."
            exit 1
          fi

          echo "ADT encontrado:"
          echo "$ADT"

          chmod +x "$ADT"

          echo "ADT_PATH=$ADT" >> "$GITHUB_ENV"

      - name: Mostrar versión AIR
        run: |
          echo "=== AIR / ADT ==="

          "$ADT_PATH" -version

      - name: Crear IPA de prueba
        run: |
          echo "=== CREANDO IPA ==="

          "$ADT_PATH" \
            -package \
            -target ipa-test \
            AuronnPlay.ipa \
            application.xml \
            auron_play_jig_trap.swf

      - name: Verificar IPA
        run: |
          echo "=============================="
          echo "IPA GENERADA"
          echo "=============================="

          ls -lh AuronnPlay.ipa

          echo ""
          echo "=============================="
          echo "CONTENIDO IPA"
          echo "=============================="

          unzip -l AuronnPlay.ipa | head -60

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Auronn-Play-Saw-Trap-IPA
          path: AuronnPlay.ipa
