name: Build Auronn Play Saw Trap

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:

      # ==========================================
      # 1. DESCARGAR PROYECTO
      # ==========================================

      - name: Descargar proyecto
        uses: actions/checkout@v4


      # ==========================================
      # 2. INSTALAR JAVA
      # ==========================================

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. DESCARGAR AIR SDK
      # ==========================================

      - name: Descargar AIR SDK
        run: |
          set -e

          echo "======================================"
          echo "DESCARGANDO AIR SDK 51.4.1.1"
          echo "======================================"

          mkdir -p "$HOME/air"

          curl -fL \
            "https://airsdk.harman.com/api/versions/51.4.1.1/sdks/AIRSDK_MacOS.zip?license=accepted" \
            -o "$HOME/air/AIRSDK_MacOS.zip"

          echo ""
          echo "Descarga terminada."

          ls -lh "$HOME/air/AIRSDK_MacOS.zip"

          echo ""
          echo "Comprobando ZIP..."

          unzip -t "$HOME/air/AIRSDK_MacOS.zip"


      # ==========================================
      # 4. EXTRAER AIR SDK
      # ==========================================

      - name: Extraer AIR SDK
        run: |
          set -e

          mkdir -p "$HOME/air/sdk"

          unzip -q \
            "$HOME/air/AIRSDK_MacOS.zip" \
            -d "$HOME/air/sdk"

          echo "======================================"
          echo "BUSCANDO ADT"
          echo "======================================"

          find "$HOME/air/sdk" \
            -type f \
            -name adt \
            -print


      # ==========================================
      # 5. CONFIGURAR AIR
      # ==========================================

      - name: Configurar AIR SDK
        run: |
          set -e

          ADT=$(find "$HOME/air/sdk" \
            -type f \
            -name adt \
            -print \
            -quit)

          if [ -z "$ADT" ]; then
            echo "ERROR: No se encontró ADT."
            exit 1
          fi

          AIR_HOME=$(dirname "$(dirname "$ADT")")

          echo "AIR_HOME=$AIR_HOME" >> "$GITHUB_ENV"
          echo "$AIR_HOME/bin" >> "$GITHUB_PATH"

          chmod +x "$AIR_HOME/bin/adt"

          echo "======================================"
          echo "AIR_HOME"
          echo "======================================"

          echo "$AIR_HOME"

          echo ""
          echo "======================================"
          echo "ADT"
          echo "======================================"

          echo "$ADT"


      # ==========================================
      # 6. COMPROBAR AIR
      # ==========================================

      - name: Comprobar AIR
        run: |
          echo "======================================"
          echo "VERSION DE AIR"
          echo "======================================"

          adt -version

          echo ""
          echo "======================================"
          echo "UBICACION DE ADT"
          echo "======================================"

          which adt


      # ==========================================
      # 7. DESCARGAR SWF
      # ==========================================

      - name: Descargar SWF del juego
        run: |
          set -e

          echo "======================================"
          echo "DESCARGANDO AURONN PLAY SAW TRAP"
          echo "======================================"

          curl -fL \
            "https://github.com/danaeeper/flash/releases/download/game-assets/auron_play_jig_trap.swf" \
            -o auron_play_jig_trap.swf

          echo ""
          echo "SWF descargado:"

          ls -lh auron_play_jig_trap.swf

          echo ""
          echo "Tipo de archivo:"

          file auron_play_jig_trap.swf


      # ==========================================
      # 8. CREAR APPLICATION.XML
      # ==========================================

      - name: Crear application.xml
        run: |
          cat > application.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <application xmlns="http://ns.adobe.com/air/application/51.0">

              <id>com.catita.auronnplayjigtrap</id>

              <versionNumber>1.0.0</versionNumber>

              <filename>AuronnPlaySawTrap</filename>

              <name>Auronn Play Saw Trap</name>

              <description>Auronn Play Saw Trap</description>

              <initialWindow>

                  <content>auron_play_jig_trap.swf</content>

                  <visible>true</visible>

                  <fullScreen>true</fullScreen>

                  <aspectRatio>landscape</aspectRatio>

                  <autoOrients>false</autoOrients>

                  <renderMode>direct</renderMode>

              </initialWindow>

              <supportedProfiles>mobileDevice</supportedProfiles>

              <iPhone>

                  <InfoAdditions><![CDATA[

                      <key>UIRequiresFullScreen</key>
                      <true/>

                  ]]></InfoAdditions>

              </iPhone>

          </application>
          EOF

          echo "======================================"
          echo "APPLICATION.XML"
          echo "======================================"

          cat application.xml


      # ==========================================
      # 9. VERIFICAR XML
      # ==========================================

      - name: Verificar XML
        run: |
          set -e

          echo "======================================"
          echo "VERIFICANDO APPLICATION.XML"
          echo "======================================"

          xmllint --noout application.xml

          echo ""
          echo "XML CORRECTO."


      # ==========================================
      # 10. CREAR CERTIFICADO DE PRUEBA AIR
      # ==========================================

      - name: Crear certificado de prueba AIR
        run: |
          set -e

          echo "======================================"
          echo "CREANDO CERTIFICADO"
          echo "======================================"

          adt \
            -certificate \
            -cn AuronnPlay \
            -validityPeriod 25 \
            2048-RSA \
            auronn-test.p12 \
            auronnpassword

          echo ""
          echo "Certificado creado."

          ls -lh auronn-test.p12


      # ==========================================
      # 11. PREPARAR AIRI
      # ==========================================

      - name: Preparar paquete AIRI
        run: |
          set -e

          echo "======================================"
          echo "PREPARANDO AIRI"
          echo "======================================"

          adt \
            -prepare \
            AuronnPlay.airi \
            application.xml \
            auron_play_jig_trap.swf

          echo ""
          echo "======================================"
          echo "AIRI GENERADO"
          echo "======================================"

          ls -lh AuronnPlay.airi


      # ==========================================
      # 12. VERIFICAR AIRI
      # ==========================================

      - name: Verificar AIRI
        run: |
          set -e

          echo "======================================"
          echo "VERIFICANDO AIRI"
          echo "======================================"

          file AuronnPlay.airi

          unzip -l AuronnPlay.airi | head -60


      # ==========================================
      # 13. GUARDAR AIRI
      # ==========================================

      - name: Guardar AIRI
        uses: actions/upload-artifact@v4
        with:
          name: Auronn-Play-Saw-Trap-AIRI
          path: AuronnPlay.airi


      # ==========================================
      # 14. PRUEBA IPA SIN MOBILEPROVISION
      # ==========================================

      - name: Intentar generar IPA sin MobileProvision
        continue-on-error: true
        run: |
          set +e

          echo "======================================"
          echo "PRUEBA DE IPA SIN MOBILEPROVISION"
          echo "======================================"

          echo ""
          echo "Intentando convertir AIRI -> IPA..."
          echo ""

          adt \
            -package \
            -target ipa-test \
            -storetype pkcs12 \
            -keystore auronn-test.p12 \
            -storepass auronnpassword \
            AuronnPlay-test.ipa \
            AuronnPlay.airi \
            2>&1 | tee ipa-build.log

          ADT_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "RESULTADO ADT"
          echo "======================================"

          echo "Código de salida: $ADT_EXIT"

          if [ -f AuronnPlay-test.ipa ]; then

            echo ""
            echo "======================================"
            echo "🎉 ¡SE GENERÓ UN IPA!"
            echo "======================================"

            ls -lh AuronnPlay-test.ipa

          else

            echo ""
            echo "======================================"
            echo "❌ NO SE GENERÓ EL IPA"
            echo "======================================"

            echo ""
            echo "ADT terminó sin crear el archivo IPA."
            echo ""
            echo "El registro completo está en:"
            echo "ipa-build.log"

          fi

          echo ""
          echo "======================================"
          echo "FIN DE LA PRUEBA"
          echo "======================================"

          exit 0


      # ==========================================
      # 15. GUARDAR RESULTADOS DE LA PRUEBA
      # ==========================================

      - name: Guardar resultado de prueba
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resultado-IPA-Sin-MobileProvision
          path: |
            ipa-build.log
            AuronnPlay-test.ipa
          if-no-files-found: ignore
