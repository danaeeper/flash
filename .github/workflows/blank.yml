name: Build FlashBox IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer proyecto FlashBox
        run: |
          unzip -q FlashBox-iOS.zip
          cp -R FlashBox-iOS/. .
          rm -rf FlashBox-iOS
          rm -f FlashBox-iOS.zip

      - name: Configurar proyecto
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("project.yml")
          text = path.read_text()

          text = text.replace(
              'deploymentTarget: "16.0"',
              'deploymentTarget: "17.0"'
          )

          path.write_text(text)

          print("=== Deployment Target ===")
          for line in text.splitlines():
              if "deploymentTarget" in line:
                  print(line)
          PY

      - name: Crear Info.plist
        run: |
          cat > FlashBox/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>FlashBox</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>FlashBox</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UILaunchScreen</key>
              <dict/>

              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Configurar Info.plist en XcodeGen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("project.yml")
          text = path.read_text()

          if "INFOPLIST_FILE:" not in text:
              text = text.replace(
                  "PRODUCT_BUNDLE_IDENTIFIER: com.catita.flashbox",
                  "PRODUCT_BUNDLE_IDENTIFIER: com.catita.flashbox\n        INFOPLIST_FILE: FlashBox/Info.plist"
              )

          path.write_text(text)

          print("=== Configuración Info.plist ===")
          for line in text.splitlines():
              if "INFOPLIST_FILE" in line:
                  print(line)
          PY

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Preparar Ruffle
        run: |
          mkdir -p FlashBox/Resources/Ruffle

          curl -L \
            "https://github.com/ruffle-rs/ruffle/releases/download/nightly-2026-10-05/ruffle-nightly-2026_10_05-web-selfhosted.zip" \
            -o ruffle.zip

          unzip -q ruffle.zip -d FlashBox/Resources/Ruffle
          rm ruffle.zip

      - name: Verificar proyecto
        run: |
          echo "=== project.yml ==="
          cat project.yml

          echo "=== Info.plist ==="
          cat FlashBox/Info.plist

          echo "=== Recursos Ruffle ==="
          find FlashBox/Resources/Ruffle -maxdepth 1 -type f | head -30

      - name: Generar proyecto Xcode
        run: |
          xcodegen generate

      - name: Compilar FlashBox
        run: |
          xcodebuild \
            -project FlashBox.xcodeproj \
            -scheme FlashBox \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Crear IPA
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/FlashBox.app \
            Payload/FlashBox.app

          zip -r FlashBox.ipa Payload

      - name: Verificar IPA
        run: |
          echo "=== IPA ==="
          ls -lh FlashBox.ipa

          echo "=== Contenido ==="
          unzip -l FlashBox.ipa | head -40

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlashBox-IPA
          path: FlashBox.ipa
