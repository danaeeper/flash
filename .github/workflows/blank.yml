name: Build FlashBox IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer proyecto FlashBox
        run: |
          unzip -q FlashBox-iOS.zip
          cp -R FlashBox-iOS/. .
          rm -rf FlashBox-iOS
          rm -f FlashBox-iOS.zip

      - name: Configurar iOS 17
        run: |
          sed -i '' 's/deploymentTarget: "16.0"/deploymentTarget: "17.0"/g' project.yml
          echo "Deployment target:"
          grep deploymentTarget project.yml

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Preparar Ruffle
        run: |
          mkdir -p FlashBox/Resources/Ruffle
          curl -L "https://github.com/ruffle-rs/ruffle/releases/download/nightly-2026-10-05/ruffle-nightly-2026_10_05-web-selfhosted.zip" -o ruffle.zip
          unzip -q ruffle.zip -d FlashBox/Resources/Ruffle
          rm ruffle.zip

      - name: Verificar proyecto
        run: |
          echo "=== Archivos principales ==="
          ls -la
          echo "=== FlashBox ==="
          find FlashBox -maxdepth 2 -type f | head -50
          echo "=== Deployment Target ==="
          grep deploymentTarget project.yml

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar FlashBox
        run: |
          xcodebuild \
            -project FlashBox.xcodeproj \
            -scheme FlashBox \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/FlashBox.app Payload/
          zip -r FlashBox.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlashBox-IPA
          path: FlashBox.ipa
