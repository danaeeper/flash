name: Build FlashBox IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Preparar Ruffle
        run: |
          chmod +x Scripts/fetch_ruffle.sh
          ./Scripts/fetch_ruffle.sh

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar FlashBox
        run: |
          xcodebuild \
            -project FlashBox.xcodeproj \
            -scheme FlashBox \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/FlashBox.app Payload/
          zip -r FlashBox.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlashBox-IPA
          path: FlashBox.ipa
